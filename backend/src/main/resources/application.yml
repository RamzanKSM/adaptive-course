server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:sqlite:${APP_DATABASE_PATH:./data/adaptive-tutor.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA foreign_keys=ON
  flyway:
    enabled: true
app:
  session-hours: ${APP_SESSION_HOURS:168}
  cookie-secure: ${APP_COOKIE_SECURE:false}
  bootstrap-admin-login: ${APP_BOOTSTRAP_ADMIN_LOGIN:}
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  llm:
    enabled: ${APP_LLM_ENABLED:false}
    model: ${CODEX_MODEL:gpt-6-luna}
    # Fallback level; each purpose has its own: task generation needs careful checks, chat needs fast answers.
    reasoning-effort: ${CODEX_REASONING_EFFORT:medium}
    reasoning-effort-task: ${CODEX_REASONING_EFFORT_TASK:high}
    reasoning-effort-chat: ${CODEX_REASONING_EFFORT_CHAT:low}
    reasoning-effort-explanation: ${CODEX_REASONING_EFFORT_EXPLANATION:medium}
    app-server-command: ${CODEX_APP_SERVER_COMMAND:codex --disable shell_tool app-server --listen stdio://}
    account-namespace: ${CODEX_ACCOUNT_NAMESPACE:default}
    sandbox-directory: ${CODEX_SANDBOX_DIRECTORY:./data/codex-sandbox}
    # Opt in only after live denial tests prove the deployed Linux sandbox cannot
    # access CODEX_HOME/auth.json or host paths from an untrusted student turn.
    student-runtime-validated: ${APP_LLM_STUDENT_RUNTIME_VALIDATED:false}
    # Logs full prompts and answers (student messages and code included). Keep off in production unless debugging.
    log-content: ${APP_LLM_LOG_CONTENT:false}
  # Background re-verification of generated tasks accepted by older, output-only validation.
  task-audit:
    enabled: ${APP_TASK_AUDIT_ENABLED:true}
  diagnostic:
    source: ${APP_DIAGNOSTIC_SOURCE:../java_initial_diagnostic_mvp_v2.md}
    python-source: ${APP_PYTHON_DIAGNOSTIC_SOURCE:../python_initial_diagnostic_mvp.md}
  piston:
    base-url: ${PISTON_BASE_URL:}
    java-version: ${PISTON_JAVA_VERSION:}
    python-version: ${PISTON_PYTHON_VERSION:}
    compile-timeout-ms: ${PISTON_COMPILE_TIMEOUT_MS:5000}
    run-timeout-ms: ${PISTON_RUN_TIMEOUT_MS:3000}
    compile-memory-bytes: ${PISTON_COMPILE_MEMORY_BYTES:268435456}
    run-memory-bytes: ${PISTON_RUN_MEMORY_BYTES:134217728}

logging:
  level:
    root: INFO
    ru.teacherstaff.adaptive: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] [user=%X{userId:--}] %logger{0}: %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] [user=%X{userId:--}] %logger{0}: %m%n%wEx"
  # Optional file in addition to stdout, e.g. /app/data/logs/app.log; rotated by size.
  file:
    name: ${APP_LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
