server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:sqlite:${APP_DATABASE_PATH:./data/adaptive-tutor.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA foreign_keys=ON
      # Passed to the sqlite-jdbc driver for every pooled connection.
      # WAL: readers never block the writer and the writer never blocks readers (the default rollback journal makes
      #   any open read transaction block every commit). The setting is persisted in the database file.
      # busy_timeout: a writer waits this long for another short write instead of failing with SQLITE_BUSY after 3 s.
      # transaction_mode IMMEDIATE: a transaction takes the write lock at BEGIN, so two transactions that read and then
      #   write cannot deadlock on lock upgrade (which fails immediately, without waiting for busy_timeout).
      data-source-properties:
        journal_mode: WAL
        synchronous: NORMAL
        busy_timeout: 15000
        foreign_keys: true
        transaction_mode: IMMEDIATE
  flyway:
    enabled: true
app:
  session-hours: ${APP_SESSION_HOURS:168}
  cookie-secure: ${APP_COOKIE_SECURE:false}
  bootstrap-admin-login: ${APP_BOOTSTRAP_ADMIN_LOGIN:}
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  llm:
    enabled: ${APP_LLM_ENABLED:false}
    # Fallback model; each purpose may have its own (empty = use CODEX_MODEL). Admins can change them in «Настройки LLM».
    model: ${CODEX_MODEL:gpt-6-luna}
    model-chat: ${CODEX_MODEL_CHAT:}
    model-task: ${CODEX_MODEL_TASK:}
    model-explanation: ${CODEX_MODEL_EXPLANATION:}
    # Always offered in the admin model picker, even if the App Server's model/list does not report them.
    extra-models: ${APP_LLM_EXTRA_MODELS:gpt-5.6-terra}
    # Fallback level; each purpose has its own: task generation needs careful checks, chat needs fast answers.
    reasoning-effort: ${CODEX_REASONING_EFFORT:medium}
    reasoning-effort-task: ${CODEX_REASONING_EFFORT_TASK:high}
    reasoning-effort-chat: ${CODEX_REASONING_EFFORT_CHAT:low}
    reasoning-effort-explanation: ${CODEX_REASONING_EFFORT_EXPLANATION:medium}
    # Defaults until an admin changes them in «Аналитика LLM → Настройки». 0 = no limit.
    limits:
      chat-per-hour: ${APP_LLM_CHAT_PER_HOUR:30}
      chat-per-day: ${APP_LLM_CHAT_PER_DAY:150}
      tasks-per-hour: ${APP_LLM_TASKS_PER_HOUR:100}
      explanations-per-hour: ${APP_LLM_EXPLANATIONS_PER_HOUR:30}
    app-server-command: ${CODEX_APP_SERVER_COMMAND:codex --disable shell_tool app-server --listen stdio://}
    account-namespace: ${CODEX_ACCOUNT_NAMESPACE:default}
    sandbox-directory: ${CODEX_SANDBOX_DIRECTORY:./data/codex-sandbox}
    # Opt in only after live denial tests prove the deployed Linux sandbox cannot
    # access CODEX_HOME/auth.json or host paths from an untrusted student turn.
    student-runtime-validated: ${APP_LLM_STUDENT_RUNTIME_VALIDATED:false}
    # Logs full prompts and answers (student messages and code included). Keep off in production unless debugging.
    log-content: ${APP_LLM_LOG_CONTENT:false}
    # Defaults for «Настройки LLM → Логирование»: the model's answer and its reasoning summary.
    log-generation: ${APP_LLM_LOG_GENERATION:true}
    log-chat: ${APP_LLM_LOG_CHAT:false}
  # Background re-verification of generated tasks accepted by older, output-only validation.
  task-audit:
    enabled: ${APP_TASK_AUDIT_ENABLED:true}
  diagnostic:
    source: ${APP_DIAGNOSTIC_SOURCE:../java_initial_diagnostic_mvp_v2.md}
    python-source: ${APP_PYTHON_DIAGNOSTIC_SOURCE:../python_initial_diagnostic_mvp.md}
  piston:
    base-url: ${PISTON_BASE_URL:}
    java-version: ${PISTON_JAVA_VERSION:}
    python-version: ${PISTON_PYTHON_VERSION:}
    compile-timeout-ms: ${PISTON_COMPILE_TIMEOUT_MS:5000}
    run-timeout-ms: ${PISTON_RUN_TIMEOUT_MS:3000}
    compile-memory-bytes: ${PISTON_COMPILE_MEMORY_BYTES:268435456}
    run-memory-bytes: ${PISTON_RUN_MEMORY_BYTES:134217728}

logging:
  level:
    root: INFO
    ru.teacherstaff.adaptive: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] %X{who}%logger{0}: %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:--}] %X{who}%logger{0}: %m%n%wEx"
  # Optional file in addition to stdout, e.g. /app/data/logs/app.log; rotated by size.
  file:
    name: ${APP_LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
